## Waveshare publishes no BSP for ESP32-S3-Touch-LCD-1.54, so the panel-near
## layer lives in ../components/board_lcd_1_54: ST7789 over SPI, CST816 touch,
## GPIO backlight. It exposes the same bsp_* surface the AMOLED BSP did.
dependencies:
  idf: ">=5.5"
  ## IMU:n för auto-rotationen (P24).
  waveshare/qmi8658: "^2.0.0"
  ## Vibbe (app_buddy, delas in från ~/Buddy): USB-ljudkortet mot Macens
  ## ChatGPT Voice + wake word-motorn. tinyusb följer med usb_device_uac.
  espressif/usb_device_uac: "^1.3.1"
  espressif/esp-tflite-micro: "^1.3.0"
